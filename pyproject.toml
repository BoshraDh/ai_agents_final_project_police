[project]
name = "bb-ai-12-police"
version = "1.0.0"
description = "Police (cop) peer — fully decentralized P2P police-thief agent, team bb-ai-12"
readme = "README.md"
authors = [
    { name = "BoshraDh", email = "bdahamsh@campus.haifa.ac.il" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
]

[project.scripts]
bb-ai-12-police = "bb_ai_12_police.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
